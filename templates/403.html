{% extends "base.html" %}

{% block title %}Permission denied | CampusFix{% endblock %}

{% block content %}
<section class="error-page">
    <div class="container text-center">
        <span class="error-code">403</span>
        <h1>Permission denied</h1>
        <p>Your account does not have permission to open this page.</p>
        {% if user.is_authenticated %}<a class="btn btn-primary" href="{% url 'accounts:dashboard' %}">Return to your dashboard</a>{% else %}<a class="btn btn-primary" href="{% url 'accounts:login' %}">Log in</a>{% endif %}
    </div>
</section>
{% endblock %}
